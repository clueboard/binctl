openapi: 3.0.3
info:
  title: binctl
  version: "1.0.0"
servers:
  - url: /

security:
  - bearerAuth: []

paths:
  /v1/nodes:
    get:
      x-openapi-router-controller: routes
      operationId: get_nodes_list
      tags: [nodes]
      summary: List all nodes
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Paginated list of nodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePage"
    post:
      x-openapi-router-controller: routes
      operationId: post_node_create
      tags: [nodes]
      summary: Create a new node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeCreate"
      responses:
        "201":
          description: Node created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"

  /v1/nodes/{node_id}:
    parameters:
      - in: path
        name: node_id
        required: true
        schema:
          type: integer
          format: int64
    get:
      x-openapi-router-controller: routes
      operationId: get_node_detail
      tags: [nodes]
      summary: Get a node by ID
      responses:
        "200":
          description: Node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "404":
          description: Node not found
    patch:
      x-openapi-router-controller: routes
      operationId: patch_node_update
      tags: [nodes]
      summary: Update an existing node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeUpdate"
      responses:
        "200":
          description: Node updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "404":
          description: Node not found

  /v1/tags:
    get:
      x-openapi-router-controller: routes
      operationId: get_tags_list
      tags: [tags]
      summary: List all tags
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Paginated list of tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagPage"
    post:
      x-openapi-router-controller: routes
      operationId: post_tag_create
      tags: [tags]
      summary: Create a tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagCreate"
      responses:
        "201":
          description: Tag created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"

  /v1/tags/{tag_id}:
    parameters:
      - in: path
        name: tag_id
        required: true
        schema:
          type: integer
          format: int64
    get:
      x-openapi-router-controller: routes
      operationId: get_tag_detail
      tags: [tags]
      summary: Get tag by ID
      responses:
        "200":
          description: Tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "404":
          description: Tag not found
    patch:
      x-openapi-router-controller: routes
      operationId: patch_tag_update
      tags: [tags]
      summary: Update a tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagUpdate"
      responses:
        "200":
          description: Tag updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "404":
          description: Tag not found

  /v1/auth/login:
    post:
      x-openapi-router-controller: auth_operations
      operationId: login
      tags: [auth]
      summary: Obtain a bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials

  /v1/auth/logout:
    post:
      x-openapi-router-controller: auth_operations
      operationId: logout
      tags: [auth]
      summary: Revoke the current bearer token
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out successfully

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      x-bearerInfoFunc: auth_operations.lookup_token

  schemas:

    NodePage:
      type: object
      required: [total, limit, offset, items]
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/Node"

    TagPage:
      type: object
      required: [total, limit, offset, items]
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tag"

    NodeCreate:
      type: object
      required: [label]
      properties:
        label:
          type: string
        description:
          type: string
          nullable: true
        is_container:
          type: boolean
          default: false
        parent_id:
          type: integer
          format: int64
          nullable: true
        tag_ids:
          type: array
          items:
            type: integer
            format: int64
          default: []

    NodeUpdate:
      type: object
      properties:
        label:
          type: string
        description:
          type: string
          nullable: true
        is_container:
          type: boolean
        parent_id:
          type: integer
          format: int64
          nullable: true
        tag_ids:
          type: array
          items:
            type: integer
            format: int64

    Node:
      type: object
      required: [id, label, created_at, updated_at, is_container]
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
        description:
          type: string
          nullable: true
        is_container:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        parent_id:
          type: integer
          format: int64
          nullable: true
        children:
          type: array
          items:
            $ref: "#/components/schemas/NodeChild"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"

    NodeChild:
      type: object
      required: [id, label, is_container, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
        description:
          type: string
          nullable: true
        is_container:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TagCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string

    TagUpdate:
      type: object
      properties:
        name:
          type: string

    Tag:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
