[project]
name = "binctl-server"
version = "1.0.6"
description = "Graph-based storage inventory server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "uvicorn>=0.30",
    "connexion[flask,swagger-ui]>=3.3",
    "httpx2>=2.0",
    "gunicorn>=21.0",
    "milc",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
mysql = ["pymysql"]
postgresql = ["psycopg2-binary"]

[project.scripts]
binctl-manage = "binctl_server.manage:cli"

[project.urls]
Homepage = "https://github.com/clueboard/binctl"
Repository = "https://github.com/clueboard/binctl"
Issues = "https://github.com/clueboard/binctl/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["binctl_server", "binctl_server.db"]

[tool.setuptools.package-data]
binctl_server = ["openapi.yaml"]
"binctl_server.db" = ["v1.sql"]

[tool.setuptools.data-files]
"share/binctl/systemd" = ["systemd/binctl-server.service"]

[dependency-groups]
dev = [
    "binctl-client",
    "openapi-python-client>=0.21",
    "ty>=0.0.1a1",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[tool.ruff]
line-length = 160

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["I"]   # enable isort-style import sorting rules

[tool.ruff.lint.isort]
known-first-party = ["binctl_server", "binctl_cli"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
