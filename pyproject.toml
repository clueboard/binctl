[project]
name = "binctl-server"
version = "1.0.1"
description = "Graph-based storage inventory server and CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "binctl-client",
    "uvicorn>=0.30",
    "connexion[flask]>=3.3",
    "gunicorn>=21.0",
    "milc",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
mysql = ["pymysql"]
postgresql = ["psycopg2-binary"]

[project.scripts]
binctl = "binctl:cli"

[project.urls]
Homepage = "https://github.com/clueboard/binctl"
Repository = "https://github.com/clueboard/binctl"
Issues = "https://github.com/clueboard/binctl/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["binctl", "web", "routes", "auth", "auth_operations", "manage"]
packages = ["db", "binctl_spec"]

[tool.setuptools.package-data]
db = ["v1.sql"]
binctl_spec = ["openapi.yaml"]

[tool.setuptools.data-files]
"share/binctl/systemd" = ["systemd/binctl-server.service"]

[dependency-groups]
dev = [
    "openapi-python-client>=0.21",
    "ty>=0.0.1a1",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[tool.ruff]
line-length = 160

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["I"]   # enable isort-style import sorting rules

[tool.ruff.lint.isort]
known-first-party = ["binctl"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = [".", "tests"]
python_files = ["test_*.py"]
addopts = "-v"
