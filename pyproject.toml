[project]
name = "binctl"
version = "0.1.0"
description = "Storage node and tag management server + CLI"
requires-python = ">=3.11"
dependencies = [
    "binctl-client",
    "uvicorn>=0.30",
    "connexion[flask]>=3.3",
    "gunicorn>=21.0",
    "milc",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
mysql = ["pymysql"]
postgresql = ["psycopg2-binary"]

[project.scripts]
binctl = "binctl:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["binctl", "web", "routes", "db", "auth", "auth_operations", "manage"]

[dependency-groups]
dev = [
    "openapi-python-client>=0.21",
    "ty>=0.0.1a1",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 160

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["I"]   # enable isort-style import sorting rules

[tool.ruff.lint.isort]
known-first-party = ["binctl"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = [".", "tests"]
python_files = ["test_*.py"]
addopts = "-v"
